name: Toolchain compatibility evaluation

on:
  pull_request:
    paths:
      - .github/workflows/toolchain-compatibility-evaluation.yml
  push:
    branches:
      - compatibility/phase5-toolchain-evaluation

permissions:
  contents: read

jobs:
  eslint-10:
    name: ESLint 10 compatibility (non-production install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install ESLint 10 without changing the lockfile
        run: npm install --no-save --package-lock=false eslint@10.14.0 @eslint/js@10.0.1 eslint-plugin-react-hooks@7.1.1 typescript-eslint@8.72.1
      - name: Run the repository lint command
        run: npm run lint

  react-19:
    name: React 19 compatibility (non-production install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install React 19 and matching type definitions without changing the lockfile
        run: npm install --no-save --package-lock=false react@19.3.1 react-dom@19.3.1 @types/react@19.3.0 @types/react-dom@19.3.0 lighthouse@12.8.2
      - name: Unit tests against React 19
        run: npm test
      - name: Typecheck against React 19
        run: npm run typecheck
      - name: Build against React 19
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E against React 19
        env:
          CI: true
          PLAYWRIGHT_FORCE_BUNDLED: "1"
        run: npm run test:e2e
      - name: Lighthouse performance and accessibility floors against React 19
        env:
          CI: true
          PLAYWRIGHT_FORCE_BUNDLED: "1"
        run: node scripts/run-lighthouse-ci.mjs
