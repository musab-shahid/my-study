name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - feature/ui-ux-overhaul
      - feat/cgei-core-leaf-coverage-gate
      - feat/cgei-subject5-sql-vertical-slice
      - feat/cgei-subject5-next-slice

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lightweight secret pattern scan
        run: python3 scripts/scan_repo_secrets.py
      - name: Report dependency audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node --input-type=module - "$RUNNER_TEMP/npm-audit.json" "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          import fs from 'node:fs';
          const reports = [
            ['all dependencies', process.argv[2]],
            ['production dependencies (--omit=dev)', process.argv[3]],
          ];
          for (const [label, file] of reports) {
            const raw = fs.readFileSync(file, 'utf8').trim();
            if (!raw) {
              console.log(`npm audit report unavailable for ${label}; no JSON output was returned.`);
              continue;
            }
            let audit;
            try {
              audit = JSON.parse(raw);
            } catch {
              console.log(`npm audit report unavailable for ${label}; output was not valid JSON.`);
              continue;
            }
            console.log(`npm audit summary (${label}):`, JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map((entry) => typeof entry === 'string' ? entry : entry.title).join('; ');
              console.log(`[${label}] ${String(item.severity).toUpperCase()} ${name} (direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}): ${via}`);
            }
          }
          NODE
      - name: Enforce production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Design-system guard (ratchet + net-new)
        run: |
          set -euo pipefail
          # Whole-tree ratchet always runs — blocks debt growth vs baseline.
          node scripts/check-design-system.mjs --ratchet
          # Net-new is only meaningful on pull_request tip commits. On push to
          # main (including merge commits), HEAD^1 is the previous main tip and
          # the diff is the entire PR, which false-flags pre-existing debt.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=2 origin "$HEAD_SHA"
            BASE_SHA=$(git rev-parse "${HEAD_SHA}^1")
            DESIGN_SYSTEM_DIFF_BASE="$BASE_SHA" DESIGN_SYSTEM_DIFF_HEAD="$HEAD_SHA" \
              node scripts/check-design-system.mjs
          else
            echo "Skipping net-new diff on ${{ github.event_name }} (ratchet already enforced)."
          fi
      - name: Contrast WCAG spot-check
        run: npm run check:contrast
      - name: Branding guard
        run: npm run check:branding
      - name: Feature icons and logo mark
        run: npm run check:feature-icons
      - name: CGEI legacy/ folder freeze
        run: |
          git fetch origin main --depth=1 || true
          BASE_REF=origin/main bash scripts/check-cgei-legacy-freeze.sh

      - name: CGEI unified gate (validate:data + evidence + index checks)
        env:
          CGEI_EVIDENCE_REPORT: docs/cgei/source-toc/core-leaf-evidence-report.csv
        run: npm run check:cgei
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Security headers and service-worker check
        run: npm run check:headers

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        env:
          CI: true
          PLAYWRIGHT_FORCE_BUNDLED: "1"
        run: npm run test:e2e
      - name: Build for Lighthouse floors
        run: npm run build
      - name: Lighthouse performance and accessibility floors
        env:
          CI: true
          PLAYWRIGHT_FORCE_BUNDLED: "1"
        run: node scripts/run-lighthouse-ci.mjs
      - name: Upload design-system visual references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: design-system-visual-references
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  scientific-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install scientific Python dependencies
        run: python -m pip install numpy pandas statsmodels matplotlib scikit-learn
      - name: Verify Chapter 5 numerical examples
        run: python fixtures/cgei/smoke_check.py
      - name: Verify chunked CSV equivalence and peak memory lab
        run: python fixtures/cgei/chunked_csv_lab_check.py
      - name: Scientific unit fixtures (auto-discover unit_*_check.py)
        run: python3 scripts/run-unit-fixture-checks.py
      - name: Verify Core-leaf coverage gate regression cases
        run: python scripts/tests/test_audit_core_leaf_coverage.py
      - name: Run repository Core-leaf coverage audit (transitional report)
        run: python scripts/audit_core_leaf_coverage.py --allow-unmapped --report docs/cgei/source-toc/core-leaf-coverage-report.csv
      - name: Verify full-source disposition gate
        run: python3 scripts/audit_full_source_disposition.py
      - name: Enforce strict Core-leaf coverage gate
        shell: bash
        run: |
          # Required: zero unmapped Core leaves and zero blocking stale IDs.
          # Transitional reporting (allow-unmapped) remains a separate step above.
          set +e
          output="$(python scripts/audit_core_leaf_coverage.py --report /tmp/core-leaf-coverage-failcheck.csv 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Strict gate clear: no unmapped Core leaves and no blocking stale IDs."
            exit 0
          fi
          if [ "$status" -eq 1 ]; then
            echo "Strict gate FAILED: unresolved Core leaves or stale IDs remain." >&2
            echo "This step is blocking — fix dispositions/content or use an explicit deferred policy." >&2
            exit 1
          fi
          echo "Unexpected strict gate exit status: $status" >&2
          exit 1
      - name: Upload Core-leaf coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: core-leaf-coverage-report
          path: docs/cgei/source-toc/core-leaf-coverage-report.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Core-leaf evidence report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: core-leaf-evidence-report
          path: docs/cgei/source-toc/core-leaf-evidence-report.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Curriculum activity/assessment integrity
        run: python fixtures/cgei/curriculum_activity_assessment_integrity_check.py



